name: Action to build and publish the project as a nuget package to github package registry

on:
  push:
    branches: [master]
      
jobs:
  build:
    runs-on: ubuntu-latest    
    outputs: 
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }} 

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 #fetch-depth is needed for GitVersion
    
    #Build/pack the project
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Calculate version
      id: version
      run: |
        year=$(date +'%Y')
        month=$(date +'%m')
        echo "version=$year.$month.${{ github.run_number }}" >> $GITHUB_ENV
    - name: Build and Pack NuGet package
      #run: dotnet build Discovery.Master.sln /p:EnableWindowsTargeting=true -c Release
      run: dotnet build Discovery.Master.sln -c Release /p:Version=${{ env.version }}  /p:EnableWindowsTargeting=true
    - name: Upload NuGet package to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: nugetPackage
        path: bin/Release/ 
        
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' # only run job if on the master branch
    # The built-in GITHUB_TOKEN pushes to this repo's package registry — no expiring PAT needed.
    permissions:
      packages: write
      actions: read

    steps:
    #Push NuGet package to GitHub packages
    - name: Download nuget package artifact
      uses: actions/download-artifact@v4
      with:
        name: nugetPackage
    - name: Test nuget artifact download
      run: ls -R
    - name: Prep packages
      run: dotnet nuget add source --username PaulBommel --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/PaulBommel/index.json"
    - name: Push package to GitHub packages
      run: find . -name "*.nupkg" -print0 | xargs -0 -I {} dotnet nuget push {} --api-key ${{ secrets.GITHUB_TOKEN }} --source github --skip-duplicate

